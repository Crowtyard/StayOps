# StayOps Desktop (electron-builder 配置)
# D1：win-unpacked（dir target）为正式输出；portable 为可选增量目标。

appId: com.stayops.desktop
productName: StayOps
copyright: Copyright © 2026 StayOps

directories:
  output: dist
  buildResources: build

# 应用代码：编译产物 + 启动窗口静态资源 + 托盘图标。
# 运行时零第三方依赖（main 进程只用 Node 内置模块 + electron）。
# 注意：files 根目录 dist/ 同时也是 electron-builder 的输出目录
# （directories.output: dist），必须排除 dist/win-unpacked，否则打包产物
# 会被整体递归进 app.asar（366MB 自嵌套，含另一份 app.asar）。
files:
  - dist/**
  - "!dist/win-unpacked/**"
  - "!dist/win-unpacked"
  - src/startup/**
  - assets/**
  - "!assets/icon-master.png"
  - package.json

# 前端生产构建（Next standalone）由 scripts/install-standalone.mjs 经
# afterPack 钩子复制到 resources/frontend-server（不打进 asar：Node 子进程
# 需要真实文件系统路径）。D2 起该目录被**物化**为真实文件（junction 全部
# 展开，且清除 Next 内嵌的开发机绝对路径），安装版不依赖开发机工作区。
afterPack: scripts/after-pack.cjs

# D2：Fully Bundled runtime（真实文件系统，不进 asar）。
# 由 `node scripts/bundle-runtimes.mjs` 生成 desktop/.bundle/ 后打包。
extraResources:
  - from: .bundle/backend
    to: backend
  - from: .bundle/python
    to: python
  - from: .bundle/postgres
    to: postgres
  - from: .bundle/node
    to: node
  - from: .bundle/scripts
    to: scripts

# 离线构建：直接复用 node_modules/electron/dist（pnpm 安装的固定版本
# electron@44.0.0），不再联网下载 electron zip（网络受限环境必需，
# 且保证打包二进制与 devDependency 版本严格一致）。
electronDist: node_modules/electron/dist

asar: true
compression: normal
npmRebuild: false

win:
  target:
    - target: dir
      arch:
        - x64
  icon: build/icon.ico
  artifactName: StayOps-${version}-${arch}.${ext}

# D2：NSIS 安装包（per-user，无需管理员日常运行）。
# 数据目录 %PROGRAMDATA%\StayOps（数据库/配置）与安装目录彻底分离；
# 卸载默认**不删除**业务数据库（deleteAppDataOnUninstall: false）。
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: StayOps
  uninstallDisplayName: StayOps ${version}
  deleteAppDataOnUninstall: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  artifactName: StayOps-Setup-${version}.${ext}

portable:
  artifactName: StayOps-Portable-${version}-${arch}.${ext}
